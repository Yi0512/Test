# =====================================
# 训练配置文件
# =====================================

# 基本参数
epochs: 50                  # 训练轮数
batch_size: 16              # 批大小
learning_rate: 0.001        # 初始学习率
num_classes: 2              # 类别数
image_size: 416             # 输入图像大小

# 优化器配置
optimizer: "Adam"           # 优化器类型: Adam, SGD
weight_decay: 0.0005        # L2 正则化系数
momentum: 0.9               # 动量（如果使用 SGD）

# 学习率调度
lr_scheduler: "cosine"      # 学习率调度: constant, cosine, step
lr_warmup_epochs: 5         # 学习率预热轮数

# 数据增强
augmentation: true
augmentation_config:
  flip: 0.5                 # 水平翻转概率
  rotation: 15              # 旋转角度
  brightness: 0.2           # 亮度变化
  contrast: 0.2             # 对比度变化

# 损失函数
loss_function: "cross_entropy"  # 损失函数类型

# 模型保存
save_interval: 5            # 每多少个 epoch 保存一次
early_stopping: true        # 是否启用早停
early_stopping_patience: 10  # 早停耐心值

# 输出配置
output_dir: "output/models" # 模型保存目录
log_interval: 10            # 每多少个 batch 打印一次日志

# 设备配置
device: "gpu"              # 设备: gpu, cpu
gpu_id: 0                  # GPU ID
