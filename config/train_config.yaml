augmentation: true
augmentation_config:
  brightness: 0.2
  contrast: 0.2
  flip: 0.5
  rotation: 15
batch_size: 16
data_dir: ./data
device: cpu
early_stopping: true
early_stopping_patience: 10
epochs: 50
gpu_id: 0
image_size: 416
learning_rate: 0.001
log_interval: 10
loss_function: cross_entropy
lr_scheduler: cosine
lr_warmup_epochs: 5
momentum: 0.9
num_classes: 2
optimizer: Adam
output_dir: output/models
save_interval: 5
test_image_dir: ./data/test
test_label_dir: ./data/test
train_image_dir: ./data/train
train_label_dir: ./data/train
use_test_data: true
val_image_dir: ./data/val
val_label_dir: ./data/val
weight_decay: 0.0005
